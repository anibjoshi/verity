[project]
name = "verity-eval"
version = "0.0.0"
description = "Verity Phase 0 evaluation harness and catastrophe corpus."
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["verity_eval"]
