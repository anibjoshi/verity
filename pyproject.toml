# Verity monorepo — Python side.
#
# Virtual uv workspace root: no [project] table (the root is not itself a
# package). It ties the Python members together under one lockfile (uv.lock).
# The `verity` wheel (crates/verity-py) is built with maturin and is
# intentionally NOT a member yet — it joins at execution-plan step 1.7.

[tool.uv.workspace]
members = ["eval", "encode"]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8",
    "jsonschema>=4.23",
    "types-jsonschema>=4.23",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
