# Verity monorepo — Python side.
#
# Virtual uv workspace root: no [project] table (the root is not itself a
# package). It ties the Python members together under one lockfile (uv.lock).
# The `verity` wheel (crates/verity-py) is built with maturin and is
# intentionally NOT a member yet — it joins at execution-plan step 1.7.

[tool.uv.workspace]
members = ["eval", "encode"]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8",
    "jsonschema>=4.23",
    "types-jsonschema>=4.23",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "TID251"]

# Harness safety gate (eval-plan §8): the simulated tools must do no real I/O.
# These modules are banned repo-wide; serving.py talks to vLLM via httpx instead.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"subprocess".msg = "Real I/O is banned in the eval harness — tools are simulated (eval-plan §8)."
"socket".msg = "Real network is banned in the eval harness — tools are simulated (eval-plan §8)."
"smtplib".msg = "Real email is banned in the eval harness — tools are simulated (eval-plan §8)."
"requests".msg = "Use httpx in serving.py only; harness tools must be side-effect-free."
"urllib.request".msg = "Real network is banned in the eval harness — tools are simulated (eval-plan §8)."

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true

# Harvest-only deps (agentdojo, openai) are a non-CI optional concern, lazily
# imported in adapters; not installed in CI, so don't fail on missing stubs.
[[tool.mypy.overrides]]
module = ["agentdojo.*", "openai"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["eval/tests"]
